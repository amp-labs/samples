specVersion: 1.0.0
integrations:
  - name: read-zoominfo
    provider: zoomInfo
    read:
      objects:
        - objectName: industries
          destination: zoominfoWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          requiredFields:
            - fieldName: name
          optionalFieldsAuto: all
          backfill:
            defaultPeriod:
              fullHistory: true

        - objectName: contacts
          destination: zoominfoWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          requiredFields:
            - fieldName: firstName
            - fieldName: lastUpdatedDate
          optionalFieldsAuto: all

        - objectName: news
          destination: zoominfoWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          requiredFields:
            - fieldName: title
            - fieldName: pageDate
          optionalFieldsAuto: all
          backfill:
            defaultPeriod:
              fullHistory: true

    write:
      objects:
        - objectName: audiences
        - objectName: products
