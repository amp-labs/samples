# SuperSend Integration
# API Documentation: https://docs.supersend.io

specVersion: 1.0.0
integrations:
  - name: readWriteSuperSend
    displayName: SuperSend read and write
    provider: superSend

    # Define what you want to read
    # Learn more: https://docs.withampersand.com/docs/read-actions
    read:
      objects:
        - objectName: teams
          destination: superSendWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # https://docs.supersend.io
          requiredFields:
            - fieldName: id
            - fieldName: name
          optionalFieldsAuto: all
          backfill:
            defaultPeriod:
              fullHistory: true

        - objectName: senders
          destination: superSendWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # https://docs.supersend.io
          requiredFields:
            - fieldName: id
            - fieldName: email
          optionalFieldsAuto: all
          backfill:
            defaultPeriod:
              fullHistory: true

        - objectName: managed-domains
          destination: superSendWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # https://docs.supersend.io
          requiredFields:
            - fieldName: id
            - fieldName: name
          optionalFieldsAuto: all
          backfill:
            defaultPeriod:
              fullHistory: true

        - objectName: managed-mailboxes
          destination: superSendWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # https://docs.supersend.io
          requiredFields:
            - fieldName: id
            - fieldName: email
          optionalFieldsAuto: all
          backfill:
            defaultPeriod:
              fullHistory: true

        - objectName: placement-tests
          destination: superSendWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # https://docs.supersend.io
          requiredFields:
            - fieldName: id
            - fieldName: name
          optionalFieldsAuto: all
          backfill:
            defaultPeriod:
              fullHistory: true

    # Define the objects you want to write to.
    # See https://docs.withampersand.com/docs/write-actions for more information.
    write:
      objects:
        - objectName: labels           # https://docs.supersend.io
        - objectName: senders          # https://docs.supersend.io
        - objectName: teams            # https://docs.supersend.io
        - objectName: campaigns        # https://docs.supersend.io
        - objectName: contacts         # https://docs.supersend.io
        - objectName: sender-profiles  # https://docs.supersend.io

    proxy:
      enabled: true
