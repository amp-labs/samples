specVersion: 1.0.0
integrations:
  - name: readAndWriteStripe
    displayName: Stripe read and write
    provider: stripe
    # Define what you want to read
    # Learn more: https://docs.withampersand.com/docs/read-actions
    read:
      objects:
        - objectName: customers
          destination: stripeWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names come from https://docs.stripe.com/api/customers/object
          requiredFields:
            - fieldName: id
            - fieldName: email
          optionalFieldsAuto: all

        - objectName: prices
          destination: stripeWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names come from https://docs.stripe.com/api/prices/object
          requiredFields:
            - fieldName: id
            - fieldName: currency
          optionalFieldsAuto: all

        - objectName: products
          destination: stripeWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names come from https://docs.stripe.com/api/products/object
          requiredFields:
            - fieldName: id
            - fieldName: name
          optionalFieldsAuto: all

        - objectName: climate/suppliers
          destination: stripeWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names come from https://docs.stripe.com/api/climate/supplier/object
          requiredFields:
            - fieldName: id
            - fieldName: name
          optionalFieldsAuto: all

        - objectName: invoices
          destination: stripeWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names come from https://docs.stripe.com/api/invoices
          requiredFields:
            - fieldName: id
            - fieldName: description
          optionalFieldsAuto: all

        # Object with fields in JSONPath bracket notation.
        - objectName: balance_transactions
          destination: stripeWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names come from https://docs.stripe.com/api/balance_transactions/object
          requiredFields:
            - fieldName: id
            - fieldName: description
            - fieldName: "$['source']['amount']"
              mapToName: sourceAmount
            - fieldName: "$['source']['payment_intent']['currency']"
            - fieldName: "$['source']['payment_intent']['customer']['name']"
              mapToName: customerName # field is given an alias for brevity
          optionalFieldsAuto: all

        # Treasury object.
        - objectName: treasury/received_credits
          destination: stripeWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names come from https://docs.stripe.com/api/treasury/credit_reversals/list
          requiredFields:
            - fieldName: amount
          optionalFieldsAuto: all

    write:
      objects:
        - objectName: customers
        - objectName: prices
        - objectName: products

    proxy:
      enabled: true
