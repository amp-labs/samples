specVersion: 1.0.0
integrations:
  - name: readWriteRamp
    displayName: Ramp read and write
    provider: ramp

    read:
      objects:
        # https://docs.ramp.com/developer-api/v1/api/transactions
        - objectName: transactions
          destination: rampWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          requiredFields:
            - fieldName: id
            - fieldName: amount
            - fieldName: currency_code
            - fieldName: merchant_name
            - fieldName: state
            - fieldName: user_transaction_time
          optionalFields:
            - fieldName: card_id
            - fieldName: card_holder
            - fieldName: memo
            - fieldName: receipts
            - fieldName: sync_status
          backfill:
            defaultPeriod:
              days: 30

        # https://docs.ramp.com/developer-api/v1/api/vendors
        - objectName: vendors
          destination: rampWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          requiredFields:
            - fieldName: id
            - fieldName: name
            - fieldName: is_active
          optionalFieldsAuto: all
          backfill:
            defaultPeriod:
              days: 30

        # https://docs.ramp.com/developer-api/v1/api/users
        - objectName: users
          destination: rampWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          requiredFields:
            - fieldName: id
            - fieldName: email
            - fieldName: first_name
            - fieldName: last_name
            - fieldName: role
            - fieldName: status
          optionalFields:
            - fieldName: department_id
            - fieldName: location_id
            - fieldName: manager_id

        # https://docs.ramp.com/developer-api/v1/api/departments
        - objectName: departments
          destination: rampWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          requiredFields:
            - fieldName: id
            - fieldName: name
