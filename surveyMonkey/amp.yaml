specVersion: 1.0.0
integrations:
  - name: readAndWriteSurveyMonkey
    displayName: SurveyMonkey read and write
    provider: surveyMonkey

    # Define what you want to read
    # Learn more: https://docs.withampersand.com/docs/read-actions
    read:
      objects:

        - objectName: contacts
          destination: surveyMonkeyWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names can be found at https://api.surveymonkey.com/v3/docs#api-endpoints-get-contacts
          requiredFields:
            - fieldName: id
            - fieldName: email
            - fieldName: first_name
            - fieldName: last_name
          optionalFieldsAuto: all

        - objectName: contact_lists
          destination: surveyMonkeyWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names can be found at https://api.surveymonkey.com/v3/docs#api-endpoints-get-contact_lists
          requiredFields:
            - fieldName: id
            - fieldName: name
          optionalFieldsAuto: all

        - objectName: surveys
          destination: surveyMonkeyWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names can be found at https://api.surveymonkey.com/v3/docs#api-endpoints-get-surveys
          requiredFields:
            - fieldName: id
            - fieldName: title
          optionalFieldsAuto: all

        - objectName: survey_folders
          destination: surveyMonkeyWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names can be found at https://api.surveymonkey.com/v3/docs#api-endpoints-get-survey_folders
          requiredFields:
            - fieldName: id
            - fieldName: title
          optionalFieldsAuto: all

        - objectName: contact_fields
          destination: surveyMonkeyWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names can be found at https://api.surveymonkey.com/v3/docs#api-endpoints-get-contact_fields
          requiredFields:
            - fieldName: id
            - fieldName: label
          optionalFieldsAuto: all

        - objectName: workgroups
          destination: surveyMonkeyWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          # Field names can be found at https://api.surveymonkey.com/v3/docs#api-endpoints-get-workgroups
          requiredFields:
            - fieldName: id
            - fieldName: name
          optionalFieldsAuto: all

    write:
      objects:
        - objectName: contacts # https://api.surveymonkey.com/v3/docs#api-endpoints-post-contacts
        - objectName: contact_lists # https://api.surveymonkey.com/v3/docs#api-endpoints-post-contact_lists
        - objectName: surveys # https://api.surveymonkey.com/v3/docs#api-endpoints-post-surveys
        - objectName: survey_folders # https://api.surveymonkey.com/v3/docs#api-endpoints-post-survey_folders (create only)
        - objectName: contact_fields # https://api.surveymonkey.com/v3/docs#api-endpoints-patch-contact_fields-id (update only)

    proxy:
      enabled: true
