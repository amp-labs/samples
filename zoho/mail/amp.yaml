specVersion: 1.0.0
integrations:
  - name: read-write-zoho-mail
    provider: zoho
    module: mailclear
    read:
      objects:
        # https://www.zoho.com/mail/help/api/get-emails-list.html
        - objectName: messages
          destination: zohoMailWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          requiredFields:
            - fieldName: messageId
            - fieldName: subject
            - fieldName: fromAddress

        # https://www.zoho.com/mail/help/api/get-all-users-accounts.html
        - objectName: accounts
          destination: zohoMailWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          requiredFields:
            - fieldName: accountId
            - fieldName: country
            - fieldName: language
          optionalFieldsAuto: all

        # https://www.zoho.com/mail/help/api/get-all-notes.html
        - objectName: notes
          destination: zohoMailWebhook
          schedule: "*/10 * * * *" # Every 10 minutes
          requiredFields:
            - fieldName: entityId
            - fieldName: title
            - fieldName: content
          optionalFieldsAuto: all
          backfill:
            defaultPeriod:
              fullHistory: true

    write:
      objects:
        # https://www.zoho.com/mail/help/api/post-add-new-task.html
        - objectName: tasks
        # https://www.zoho.com/mail/help/api/add-user-signature.html
        - objectName: signature
        # https://www.zoho.com/mail/help/api/post-send-an-email.html
        - objectName: messages
        # https://www.zoho.com/mail/help/api/add-custom-status-to-task.html
        - objectName: customStatus